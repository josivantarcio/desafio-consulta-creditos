server:
  port: 8080

spring:
  application:
    name: consulta-creditos-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/creditos_db}
    username: ${SPRING_DATASOURCE_USERNAME:credito_user}
    password: ${SPRING_DATASOURCE_PASSWORD:credito_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        request.timeout.ms: 3000
        max.block.ms: 3000

app:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    topic-auditoria: credito-consulta-auditoria

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
